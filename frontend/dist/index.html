<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        #eventHistory {
            width: 800px;
            height: 100px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background-color: #f9f9f9;
        }

        #spinHistory {
            width: 800px;
            height: 100px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background-color: #f9f9f9;
        }

            #spinHistory td {
                padding-left: 10px;
            }

        #ReadMe {
            margin-left: 20px;
            width: 800px;
        }

        .content {
            display: flex;
            flex-direction: column;
        }

        .content {
            display: unset;
            flex-direction: unset;
        }

        .main-layout {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
        }

        .gameLogs {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
        }

        #game-container {
            margin-right: 20px;
        }

        #side-panel {
            width: 300px;
            height: 600px;
            background-color: #d0e0ff;
            border: 1px solid #ccc;
            padding: 10px;
        }

        .session-data {
            width: 60px;
        }

        .wrapper {
            width: 300px;
            padding: 10px;
            height: 150px;
        }
    </style>
  <script type="module" crossorigin src="/assets/index-CARB4j72.js"></script>
</head>
<body>
    <div class="main-layout">
        <div id="game-container"></div>
        <div id="side-panel">
            <h3>This Session</h3>
            <table>
                <tr><td><label for="session-rounds-played">Rounds played: </label></td><td><input type="text" id="session-rounds-played" class="session-data" name="session-rounds-played" /></td></tr>
                <tr><td><label for="session-total-bet">Total bet: </label></td><td><input type="text" id="session-total-bet" class="session-data currency" name="session-total-bet" /></td></tr>
                <tr><td><label for="session-total-won">Total won: </label></td><td><input type="text" id="session-total-won" class="session-data currency" name="session-total-won" /></td></tr>
                <tr><td><label for="session-rtp">RTP: </label></td><td><input type="text" id="session-rtp" class="session-data percent" name="session-rtp" /></td></tr>
                <tr><td><label for="session-freespins-sessions">Freespins Sessions: </label></td><td><input type="text" id="session-freespins-sessions" class="session-data" name="session-freespins-sessions" /></td></tr>
                <tr><td><label for="session-freespins-played">Total freespins: </label></td><td><input type="text" id="session-freespins-played" class="session-data" name="session-freespins-played" /></td></tr>
            </table>
            <button id="session-reset-button">Reset</button>
            <!--

            <h3>Bet Type</h3>
            <div class="wrapper">
                <select size="5" name="" id="bet-type">
                </select>
            </div>
            -->
            <h3>Playback</h3>
            <div>
                <button id="play">▶</button>
                <button id="pause">⏸︎</button>
                <button id="quarter-speed">Quarter speed</button>
                <button id="half-speed">Half speed</button>
                <button id="full-speed">Normal speed</button>
                <button id="double-speed">X2 speed</button>
                <button id="quadrupal-speed">X4 speed</button>
                <button id="twenty-speed">X20 speed</button>
            </div>
        </div>
    </div>
    <div class="gameLogs">
        <div id="eventHistory"></div>
        <div id="spinHistory"></div>
    </div>
</body>
</html>
