<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script type="module" src="src/common/main.js"></script>
    <style>
        #eventHistory {
            width: 800px;
            height: 100px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background-color: #f9f9f9;
        }

        #spinHistory {
            width: 800px;
            height: 100px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            font-family: Arial, sans-serif;
            font-size: 14px;
            background-color: #f9f9f9;
        }

        #spinHistory td {
            padding-left: 10px;
        }

        #ReadMe {
            margin-left: 20px;
            width: 800px;
        }

        .content {
            display: flex;
            flex-direction: column;
        }

        .content {
            display: unset;
            flex-direction: unset;
        }

        .main-layout {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
        }

        .gameLogs {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
        }

        #game-container {
            margin-right: 20px;
        }

        #side-panel {
            width: 300px;
            height: 600px;
            background-color: #d0e0ff;
            border: 1px solid #ccc;
            padding: 10px;
        }

        .session-data {
            width: 60px;
        }

        .dropdown-container {
            display: flex;
            flex-direction: column;
            gap: 10px; /* vertical spacing */
            width: 250px; /* optional container width */
        }

        .dropdown-row {
            display: flex;
            align-items: center;
        }

        .dropdown-row label {
            width: 80px; /* fixed width for labels */
            margin-right: 10px; /* spacing between label and dropdown */
        }

        .dropdown-row select {
            flex: 1; /* dropdown fills remaining horizontal space */
            min-width: 150px; /* optional: minimum width */
        }

        /* RN Stream row: input + button side-by-side */
        .rn-stream-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rn-stream-row input[type="text"] {
            flex: 1;
            min-width: 150px;
        }

    </style>
</head>
<body>
<div class="main-layout">
    <div id="game-container"></div>
    <div id="side-panel">
        <h3>This Session</h3>
        <table></table>
        <button id="session-reset-button">Reset</button>
        <!--

        <h3>Bet Type</h3>
        <div class="wrapper">
            <select size="5" name="" id="bet-type">
            </select>
        </div>
        -->
        <h3>Playback</h3>
        <div>
            <button id="play">▶</button>
            <button id="pause">⏸︎</button>
            <button id="quarter-speed">Quarter speed</button>
            <button id="half-speed">Half speed</button>
            <button id="full-speed">Normal speed</button>
            <button id="double-speed">X2 speed</button>
            <button id="quadrupal-speed">X4 speed</button>
            <button id="twenty-speed">X20 speed</button>
            <button id="max-speed">Max speed</button>
        </div>
        <h3>Options</h3>
        <div class="dropdown-container">
            <div class="dropdown-row">
                <label for="rtp-selector">RTP:</label>
                <select id="rtp-selector"></select>
            </div>
            <div class="dropdown-row">
                <label for="bet-type-selector">Bet Type:</label>
                <select id="bet-type-selector"></select>
            </div>

        </div>
        <h3>RN Stream</h3>
        <div class="rn-stream-row">
            <input id="rn-stream" type="text" placeholder="Enter RN stream..."/>
            <button id="rn-stream-spin">Spin</button>
        </div>
    </div>
</div>
<div class="gameLogs">
    <div id="eventHistory" style="white-space: pre;"></div>
    <div id="spinHistory"></div>
</div>
</body>
</html>
